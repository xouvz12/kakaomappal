<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>혼자 가기 좋은 장소 추천</title>
    <style>
        /* 기본 리셋 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f9fc;
        }

        /* 화면 왼쪽과 오른쪽으로 2분할 */
        #container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* 왼쪽 사이드바: 하늘하늘 여리여리한 파스텔 테마 */
        #sidebar {
            width: 360px;
            height: 100%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e1edf5;
            background: linear-gradient(135deg, #f2f9ff 0%, #f7fbe4 100%);
            box-shadow: 4px 0 15px rgba(180, 210, 230, 0.2);
            z-index: 10;
        }

        /* 검색 영역 */
        .search-box {
            padding: 20px 15px 10px 15px;
            display: flex;
            gap: 8px;
        }
        .search-box input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #cce2f5;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
            background-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }
        .search-box input:focus {
            border-color: #a4d4f7;
            box-shadow: 0 2px 8px rgba(164, 212, 247, 0.4);
        }
        .search-box button {
            padding: 10px 18px;
            background: #bce3ff;
            color: #4a657a;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(188, 227, 255, 0.4);
        }
        .search-box button:hover {
            background: #a4d4f7;
        }

        /* 감성적인 카테고리 탭 디자인 */
        .tab-container {
            display: flex;
            padding: 5px 15px 10px 15px;
            gap: 10px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid #e1edf5;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #8fa0a8;
            transition: all 0.3s;
        }
        .tab.active {
            background: #fff;
            color: #5ba4e5;
            border-color: #bce3ff;
            box-shadow: 0 4px 10px rgba(164, 212, 247, 0.25);
        }
