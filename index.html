<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>혼자 가기 좋은 장소 추천</title>
    <style>
        /* 기본 리셋 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f9fc;
        }

        /* 화면을 왼쪽과 오른쪽으로 2분할 */
        #container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* 왼쪽 사이드바: 하늘하늘 여리여리한 감성 디자인 */
        #sidebar {
            width: 360px;
            height: 100%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e1edf5;
            background: linear-gradient(135deg, #f2f9ff 0%, #f7fbe4 100%);
            box-shadow: 4px 0 15px rgba(180, 210, 230, 0.2);
            z-index: 10;
        }

        /* 검색창 영역 */
        .search-box {
            padding: 20px 15px 10px 15px;
            display: flex;
            gap: 8px;
        }
        .search-box input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #cce2f5;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
            background-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }
        .search-box input:focus {
            border-color: #a4d4f7;
            box-shadow: 0 2px 8px rgba(164, 212, 247, 0.4);
        }
        .search-box button {
            padding: 10px 18px;
            background: #bce3ff;
            color: #4a657a;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(188, 227, 255, 0.4);
        }
        .search-box button:hover {
            background: #a4d4f7;
        }

        /* 여리여리한 파스텔톤 탭 메뉴 */
        .tab-container {
            display: flex;
            padding: 5px 15px 10px 15px;
            gap: 10px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid #e1edf5;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #8fa0a8;
            transition: all 0.3s;
        }
        .tab.active {
            background: #fff;
            color: #5ba4e5;
            border-color: #bce3ff;
            box-shadow: 0 4px 10px rgba(164, 212, 247, 0.25);
        }

        /* 왼쪽 검색 결과 리스트 (쭈르륵 세로 정렬) */
        #placesList {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            padding: 10px 15px;
        }
        #placesList li {
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.7);
            margin-bottom: 10px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #placesList li:hover {
            background: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(164, 212, 247, 0.2);
            border-color: #d1e8ff;
        }
        #placesList li strong {
            color: #3e5260;
            font-size: 15px;
            display: block;
            margin-bottom: 4px;
        }
        #placesList li small {
            color: #7c8e99;
            font-size: 12px;
            display: block;
        }
        #placesList li .distance {
            color: #ff9ebb; /* 연분홍빛 거리 표시 */
            font-size: 11px;
            font-weight: bold;
            display: block;
            margin-top: 4px;
        }

        /* 오른쪽 지도 영역 */
        #map {
            flex: 1;
            height: 100%;
        }

        /* 인포윈도우 커스텀 팝업 스타일 */
        .info-popup {
            padding: 10px;
            font-size: 12px;
            color: #4a5560;
            line-height: 1.6;
            min-width: 200px;
        }
        .info-title {
            font-weight: bold;
            font-size: 13px;
            color: #2b7bc4;
            margin-bottom: 6px;
            border-bottom: 1px solid #e8f2fa;
            padding-bottom: 4px;
        }
    </style>
</head>

            <ul id="placesList"></ul>
        </div>
        
        <div id="map"></div>
